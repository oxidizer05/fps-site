<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournaments & videos — FPS Girls</title>
<meta name="description" content="FPS Girls tournaments, community events and player interviews across CS2, Rainbow Six Siege and more.">

<style>
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Black.ttf') format('truetype');      font-weight: 900; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-ExtraBold.ttf') format('truetype');  font-weight: 800; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Bold.ttf') format('truetype');       font-weight: 700; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-SemiBold.ttf') format('truetype');   font-weight: 600; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Medium.ttf') format('truetype');     font-weight: 500; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Regular.ttf') format('truetype');    font-weight: 400; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Light.ttf') format('truetype');      font-weight: 300; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-ExtraLight.ttf') format('truetype'); font-weight: 200; font-display: swap; }

:root {
  --accent:        #CE61DF;
  --accent-glow:   rgba(206,97,223,0.30);
  --accent-subtle: rgba(206,97,223,0.12);
  --bg:            #0D0D0D;
  --surface:       #111111;
  --surface2:      #161318;
  --border:        rgba(255,255,255,0.08);
  --border-accent: rgba(206,97,223,0.40);
  --white:         #FFFFFF;
  --gray1:         #969696;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #080808;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  font-family: 'Montserrat', sans-serif;
  padding: 32px 16px 56px;
  color: var(--white);
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.35;
}

.page {
  width: 100%;
  max-width: 960px;
  position: relative;
  z-index: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 12px 60px rgba(0,0,0,0.8);
}

/* ── Header ── */
.header {
  padding: 26px 24px 22px;
  text-align: center;
  position: relative;
  overflow: hidden;
  background: linear-gradient(160deg, #180d20 0%, #0d0d14 60%, #0d0d0d 100%);
  border-bottom: 1px solid var(--border);
}
.header::after {
  content: '';
  position: absolute;
  top: -80px; left: 50%;
  transform: translateX(-50%);
  width: 320px; height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(206,97,223,0.16) 0%, transparent 70%);
  pointer-events: none;
}
.avatar {
  width: 66px; height: 66px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--accent);
  box-shadow: 0 0 20px var(--accent-glow);
  position: relative; z-index: 1;
}
.wordmark {
  font-weight: 900; font-size: 22px;
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-top: 12px; line-height: 1;
  position: relative; z-index: 1;
}
.tagline {
  font-weight: 200; font-size: 10px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--accent); margin-top: 6px;
  position: relative; z-index: 1;
}
.home-link {
  position: absolute; top: 16px; left: 16px; z-index: 2;
  display: inline-flex; align-items: center; gap: 5px;
  font-weight: 700; font-size: 10px; letter-spacing: 0.08em;
  color: var(--gray1); text-decoration: none;
  border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 10px; transition: color 150ms, border-color 150ms;
}
.home-link:hover { color: var(--white); border-color: var(--border-accent); }

.lang-switch {
  position: absolute; top: 16px; right: 16px; z-index: 2;
  display: flex; gap: 2px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 6px; padding: 2px;
}
.lang-btn {
  font-family: inherit; font-weight: 700; font-size: 10px; letter-spacing: 0.08em;
  color: var(--gray1); background: transparent; border: none; border-radius: 4px;
  padding: 5px 9px; cursor: pointer; transition: color 150ms, background 150ms;
}
.lang-btn:hover { color: var(--white); }
.lang-btn.active { background: var(--accent); color: #fff; }

/* ── Вкладки игр ── */
.tabs {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 18px 24px 0; justify-content: center;
}
.tab {
  font-family: inherit; font-weight: 700; font-size: 11px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--gray1); background: var(--surface);
  border: 1px solid var(--border); border-radius: 7px;
  padding: 9px 14px; cursor: pointer;
  transition: color 150ms, border-color 150ms, background 150ms;
}
.tab:hover { color: var(--white); border-color: var(--border-accent); }
.tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── Категории и карточки ── */
.section-label {
  display: flex; align-items: center; gap: 10px;
  padding: 22px 24px 12px;
}
.section-label .line { flex: 1; height: 1px; background: rgba(206,97,223,0.2); }
.section-label span {
  font-weight: 700; font-size: 9px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--accent);
}

.grid {
  display: grid; grid-template-columns: 1fr; gap: 12px;
  padding: 0 24px;
}
@media (min-width: 620px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.card {
  display: block; text-decoration: none;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
  transition: border-color 150ms, box-shadow 150ms, transform 150ms;
}
.card:hover {
  border-color: var(--border-accent);
  box-shadow: 0 0 20px rgba(206,97,223,0.15);
  transform: translateY(-2px);
}
.thumb { position: relative; aspect-ratio: 16 / 9; background: #000; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.65) 100%);
}
.play {
  position: absolute; inset: 0; margin: auto;
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(206,97,223,0.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 1;
}
.play svg { fill: #fff; margin-left: 3px; }
.badge {
  position: absolute; top: 8px; left: 8px; z-index: 1;
  font-weight: 700; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase;
  color: #fff; background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 4px; padding: 3px 6px;
}
.card-title {
  font-weight: 600; font-size: 12px; line-height: 1.45;
  padding: 11px 13px 13px; color: #E4E4E4;
}

.empty {
  margin: 4px 24px 0;
  background: var(--surface2); border: 1px solid var(--border);
  border-left: 2px solid var(--accent);
  border-radius: 8px; padding: 14px 16px;
  font-weight: 400; font-size: 12px; line-height: 1.6; color: #B9B9B9;
}

/* ── Подвал ── */
.foot {
  border-top: 1px solid var(--border); margin-top: 26px;
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px;
}
.foot .brand {
  font-weight: 200; font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; color: rgba(206,97,223,0.4);
}
.foot .yt {
  font-weight: 600; font-size: 10px; letter-spacing: 0.06em;
  color: var(--gray1); text-decoration: none;
}
.foot .yt:hover { color: var(--accent); }
</style>
</head>

<body>
<div class="page">

  <header class="header">
    <a class="home-link" href="index.html">← <span data-i18n="home">Home</span></a>
    <div class="lang-switch">
      <button class="lang-btn active" type="button" data-lang="en">EN</button>
      <button class="lang-btn" type="button" data-lang="ru">RU</button>
    </div>
    <img class="avatar" src="assets/logo.jpg" alt="FPS Girls">
    <div class="wordmark">FPS Girls</div>
    <div class="tagline" data-i18n="tagline">Tournaments & videos</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer class="foot">
    <a class="yt" href="https://www.youtube.com/channel/UCc6ezXFutc3XZJVi0eg1qAg" target="_blank" rel="noopener" data-i18n="ytLink">All videos on YouTube →</a>
    <div class="brand">Female Play Style</div>
  </footer>

</div>

<script>
// Видео ведутся вручную в videos.json: у YouTube нет открытого API без ключа,
// а список меняется редко. Превью берём с их CDN по id — ключ не нужен.
const I18N = {
  en: {
    title: 'Tournaments & videos — FPS Girls',
    home: 'Home',
    tagline: 'Tournaments & videos',
    tournament: 'Tournaments',
    event: 'Events',
    interview: 'Interviews',
    empty: 'Nothing here yet — this game has no recordings published.',
    loadFail: 'Could not load the video list. Please try again later.',
    ytLink: 'All videos on YouTube →',
    playlist: 'Playlist',
  },
  ru: {
    title: 'Турниры и видео — FPS Girls',
    home: 'На главную',
    tagline: 'Турниры и видео',
    tournament: 'Турниры',
    event: 'Ивенты',
    interview: 'Интервью',
    empty: 'Здесь пока пусто — по этой игре записей ещё нет.',
    loadFail: 'Не удалось загрузить список видео. Попробуй обновить страницу позже.',
    ytLink: 'Все видео на YouTube →',
    playlist: 'Плейлист',
  },
};

const CATEGORIES = ['tournament', 'event', 'interview'];

let lang = 'en';
let data = null;
let game = null;

const t = () => I18N[lang] || I18N.en;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function videoUrl(v) {
  const base = 'https://www.youtube.com/watch?v=' + encodeURIComponent(v.id);
  return v.list ? base + '&list=' + encodeURIComponent(v.list) : base;
}
// Превью: hqdefault есть у любого ролика, отдельного ключа не требует
const thumbUrl = (v) => 'https://i.ytimg.com/vi/' + encodeURIComponent(v.id) + '/hqdefault.jpg';

const PLAY_ICON = '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

function card(v) {
  return (
    '<a class="card" href="' + videoUrl(v) + '" target="_blank" rel="noopener">' +
      '<div class="thumb">' +
        '<img src="' + thumbUrl(v) + '" alt="" loading="lazy">' +
        (v.list ? '<span class="badge">' + t().playlist + '</span>' : '') +
        '<span class="play">' + PLAY_ICON + '</span>' +
      '</div>' +
      '<div class="card-title">' + esc(v.title || '') + '</div>' +
    '</a>'
  );
}

function render() {
  const tabs = document.getElementById('tabs');
  const content = document.getElementById('content');
  if (!data) return;

  // Игры без видео не показываем вовсе — пустые вкладки выглядят поломкой
  const games = (data.games || []).filter((g) => (g.videos || []).length);
  if (!games.length) {
    tabs.innerHTML = '';
    content.innerHTML = '<div class="empty">' + t().empty + '</div>';
    return;
  }
  if (!games.some((g) => g.key === game)) game = games[0].key;

  tabs.innerHTML = games
    .map((g) => '<button class="tab' + (g.key === game ? ' active' : '') + '" type="button" data-game="' + g.key + '">' + esc(g.title) + '</button>')
    .join('');
  tabs.querySelectorAll('.tab').forEach((b) =>
    b.addEventListener('click', () => { game = b.dataset.game; render(); }),
  );

  const current = games.find((g) => g.key === game);
  const blocks = CATEGORIES.map((cat) => {
    const list = (current.videos || []).filter((v) => v.category === cat);
    if (!list.length) return '';
    return (
      '<div class="section-label"><div class="line"></div><span>' + t()[cat] + '</span><div class="line"></div></div>' +
      '<div class="grid">' + list.map(card).join('') + '</div>'
    );
  }).join('');

  content.innerHTML = blocks || '<div class="empty">' + t().empty + '</div>';
}

function setLang(l) {
  lang = I18N[l] ? l : 'en';
  document.documentElement.lang = lang;
  document.title = t().title;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t()[el.dataset.i18n]; });
  document.querySelectorAll('.lang-btn').forEach((b) => b.classList.toggle('active', b.dataset.lang === lang));
  try { localStorage.setItem('fpsg-lang', lang); } catch (e) {}
  render();
}

document.querySelectorAll('.lang-btn').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));

let saved = null;
try { saved = localStorage.getItem('fpsg-lang'); } catch (e) {}
setLang(saved || 'en');

fetch('videos.json?t=' + Date.now(), { cache: 'no-store' })
  .then((r) => (r.ok ? r.json() : null))
  .then((d) => {
    if (!d) throw new Error('no data');
    data = d;
    render();
  })
  .catch(() => {
    document.getElementById('content').innerHTML = '<div class="empty">' + t().loadFail + '</div>';
  });
</script>
</body>
</html>
