<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to join — FPS Girls</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#0D0D0D">
<meta name="description" content="How to join FPS Girls: Discord roles, girl verification, and the FACEIT hub that feeds the FPS Girls community ranking.">

<style>
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Black.ttf') format('truetype');      font-weight: 900; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-ExtraBold.ttf') format('truetype');  font-weight: 800; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Bold.ttf') format('truetype');       font-weight: 700; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-SemiBold.ttf') format('truetype');   font-weight: 600; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Medium.ttf') format('truetype');     font-weight: 500; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Regular.ttf') format('truetype');    font-weight: 400; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Light.ttf') format('truetype');      font-weight: 300; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-ExtraLight.ttf') format('truetype'); font-weight: 200; font-display: swap; }

:root {
  --accent:        #CE61DF;
  --accent-glow:   rgba(206,97,223,0.30);
  --accent-subtle: rgba(206,97,223,0.12);
  --bg:            #0D0D0D;
  --surface:       #111111;
  --surface2:      #161318;
  --border:        rgba(255,255,255,0.08);
  --border-accent: rgba(206,97,223,0.40);
  --white:         #FFFFFF;
  --gray1:         #969696;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #080808;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  font-family: 'Montserrat', sans-serif;
  padding: 32px 16px 56px;
  color: var(--white);
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.35;
}

.page {
  width: 100%;
  max-width: 760px;
  position: relative;
  z-index: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 12px 60px rgba(0,0,0,0.8);
}

/* ── Header (тот же, что на рейтинге) ── */
.header {
  padding: 26px 24px 22px;
  text-align: center;
  position: relative;
  overflow: hidden;
  background: linear-gradient(160deg, #180d20 0%, #0d0d14 60%, #0d0d0d 100%);
  border-bottom: 1px solid var(--border);
}
.header::after {
  content: '';
  position: absolute;
  top: -80px; left: 50%;
  transform: translateX(-50%);
  width: 320px; height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(206,97,223,0.16) 0%, transparent 70%);
  pointer-events: none;
}
.avatar {
  width: 66px; height: 66px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--accent);
  box-shadow: 0 0 20px var(--accent-glow);
  position: relative; z-index: 1;
}
.wordmark {
  font-weight: 900; font-size: 22px;
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-top: 12px; line-height: 1;
  position: relative; z-index: 1;
}
.tagline {
  font-weight: 200; font-size: 10px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--accent); margin-top: 6px;
  position: relative; z-index: 1;
}
.home-link {
  position: absolute; top: 16px; left: 16px; z-index: 2;
  display: inline-flex; align-items: center; gap: 5px;
  font-weight: 700; font-size: 10px; letter-spacing: 0.08em;
  color: var(--gray1); text-decoration: none;
  border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 10px; transition: color 150ms, border-color 150ms;
}
.home-link:hover { color: var(--white); border-color: var(--border-accent); }

.lang-switch {
  position: absolute; top: 16px; right: 16px; z-index: 2;
  display: flex; gap: 2px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 6px; padding: 2px;
}
.lang-btn {
  font-family: inherit; font-weight: 700; font-size: 10px; letter-spacing: 0.08em;
  color: var(--gray1); background: transparent; border: none; border-radius: 4px;
  padding: 5px 9px; cursor: pointer; transition: color 150ms, background 150ms;
}
.lang-btn:hover { color: var(--white); }
.lang-btn.active { background: var(--accent); color: #fff; }

/* ── Интро ── */
.intro { padding: 24px 24px 0; text-align: center; }
.intro h1 { font-weight: 800; font-size: 18px; line-height: 1.4; letter-spacing: 0.02em; }
.intro p {
  font-weight: 400; font-size: 12px; line-height: 1.6;
  color: var(--gray1); margin-top: 8px;
  max-width: 480px; margin-left: auto; margin-right: auto;
}

/* ── Выбор ветки ── */
.tracks {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  padding: 20px 24px 0;
}
.track {
  font-family: inherit; text-align: left; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 14px;
  transition: border-color 150ms, background 150ms, box-shadow 150ms;
}
.track:hover { border-color: var(--border-accent); }
.track.active {
  border-color: var(--border-accent);
  background: linear-gradient(150deg, rgba(206,97,223,0.14) 0%, var(--surface2) 70%);
  box-shadow: 0 0 20px rgba(206,97,223,0.12);
}
.track-ico {
  width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, rgba(206,97,223,0.2) 0%, rgba(206,97,223,0.05) 100%);
  border: 1px solid rgba(206,97,223,0.3);
  display: flex; align-items: center; justify-content: center; color: var(--accent);
}
.track-body { display: block; min-width: 0; }
.track-title {
  display: block;
  font-weight: 700; font-size: 12px; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--white);
}
.track.active .track-title { color: var(--accent); }
.track-sub {
  display: block;
  font-weight: 400; font-size: 10.5px; line-height: 1.45; color: var(--gray1); margin-top: 3px;
}

/* ── Что получишь (только ветка игрока) ── */
.perks {
  margin: 18px 24px 0; padding: 14px 16px;
  background: linear-gradient(150deg, rgba(206,97,223,0.10) 0%, var(--surface) 75%);
  border: 1px solid var(--border-accent); border-radius: 10px;
}
.perks[hidden] { display: none; }
.perks-title {
  font-weight: 700; font-size: 9px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
}
.perks ul { list-style: none; }
.perks li {
  position: relative; padding-left: 16px;
  font-weight: 400; font-size: 12px; line-height: 1.6; color: #C9C9C9;
}
.perks li + li { margin-top: 4px; }
.perks li::before { content: ''; position: absolute; left: 2px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.perks li b { font-weight: 700; color: #E4E4E4; }

/* ── Шаги ── */
.steps { list-style: none; padding: 8px 24px 0; }
.step {
  display: flex; gap: 14px;
  padding: 16px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.step:last-child { border-bottom: none; }
.step-num {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: var(--accent-subtle); border: 1px solid rgba(206,97,223,0.35);
  color: var(--accent); font-weight: 800; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.step-body { flex: 1; min-width: 0; }
.step-title { font-weight: 700; font-size: 13px; letter-spacing: 0.01em; line-height: 1.4; }
.step-text {
  font-weight: 400; font-size: 12px; line-height: 1.65;
  color: #B9B9B9; margin-top: 6px;
}
.step-text b { font-weight: 700; color: #E4E4E4; }
.step-text .ch {
  font-family: inherit; font-weight: 600; font-size: 11.5px;
  color: var(--accent); background: var(--accent-subtle);
  border: 1px solid rgba(206,97,223,0.22);
  border-radius: 4px; padding: 1px 5px; white-space: nowrap;
}
.step-btn {
  display: inline-flex; align-items: center; gap: 7px;
  margin-top: 10px;
  background: var(--accent); color: #fff; text-decoration: none;
  font-weight: 800; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 9px 14px; border-radius: 7px;
  transition: box-shadow 150ms, transform 150ms;
}
.step-btn:hover { box-shadow: 0 0 20px var(--accent-glow); transform: translateY(-1px); }
.step-btn.ghost {
  background: transparent; color: var(--accent);
  border: 1px solid var(--border-accent);
}
.step-btn.ghost:hover { background: var(--accent-subtle); box-shadow: 0 0 16px rgba(206,97,223,0.12); }

.hint {
  margin: 4px 24px 0;
  background: var(--surface2); border: 1px solid var(--border);
  border-left: 2px solid var(--accent);
  border-radius: 8px; padding: 12px 14px;
  font-weight: 400; font-size: 11.5px; line-height: 1.65; color: #B9B9B9;
}
.hint b { font-weight: 700; color: #E4E4E4; }
.hint .ch {
  font-weight: 600; font-size: 11px; color: var(--accent);
  background: var(--accent-subtle); border: 1px solid rgba(206,97,223,0.22);
  border-radius: 4px; padding: 1px 5px; white-space: nowrap;
}

/* ── Кнопки внизу ── */
.cta-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  padding: 22px 24px 0;
}
.cta {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: #fff; text-decoration: none;
  font-weight: 800; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 14px 12px; border-radius: 8px; text-align: center;
  transition: box-shadow 150ms, transform 150ms;
}
.cta:hover { box-shadow: 0 0 24px var(--accent-glow); transform: translateY(-1px); }
.cta svg { flex-shrink: 0; }
.cta.ghost {
  background: transparent; color: var(--accent);
  border: 1px solid var(--border-accent);
}
.cta.ghost:hover { background: var(--accent-subtle); box-shadow: 0 0 20px rgba(206,97,223,0.12); }

/* ── Разделитель ── */
.section-label { display: flex; align-items: center; gap: 10px; padding: 24px 24px 12px; }
.section-label .line { flex: 1; height: 1px; background: rgba(206,97,223,0.2); }
.section-label span {
  font-weight: 700; font-size: 9px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--accent);
}

/* ── FAQ ── */
.faq { padding: 0 24px; }
.faq details {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 8px;
  transition: border-color 150ms;
}
.faq details[open] { border-color: var(--border-accent); }
.faq summary {
  list-style: none; cursor: pointer;
  padding: 13px 16px;
  font-weight: 600; font-size: 12px; line-height: 1.45; color: #E4E4E4;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after {
  content: '+'; color: var(--accent); font-weight: 700; font-size: 15px; flex-shrink: 0;
}
.faq details[open] summary::after { content: '−'; }
.faq summary:hover { color: var(--white); }
.faq .a {
  padding: 0 16px 14px;
  font-weight: 400; font-size: 11.5px; line-height: 1.7; color: var(--gray1);
}
.faq .a b { font-weight: 700; color: #C9C9C9; }
.faq .a a { color: var(--accent); }

/* ── Подвал ── */
.foot {
  border-top: 1px solid var(--border); margin-top: 26px;
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px;
}
.foot-games { display: flex; gap: 10px; align-items: center; }
.foot-games span { font-weight: 800; font-size: 9px; letter-spacing: 0.1em; color: rgba(255,255,255,0.25); }
.foot-games .x { color: rgba(206,97,223,0.3); }
.foot .brand {
  font-weight: 200; font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; color: rgba(206,97,223,0.4);
}
.visitors {
  padding: 4px 24px 14px; text-align: center;
  font-weight: 500; font-size: 10px; letter-spacing: 0.06em; color: rgba(150,150,150,0.85);
}

@media (max-width: 560px) {
  .tracks { grid-template-columns: 1fr; }
  .cta-row { grid-template-columns: 1fr; }
  .intro h1 { font-size: 16px; }
}
</style>
</head>

<script>
// Ссылки, которые ведут людей дальше. Инвайт продублирован в разметке выше
// (чтобы кнопка работала даже без JS) и в index.html / leaderboard.html.
const LINKS = {
  discord: 'https://discord.gg/jMmutFF',
  hub: 'https://www.faceit.com/en/club/cd91474f-b1d0-412e-b210-6332dd7833fa',
  board: 'leaderboard.html'
};

// Статические подписи страницы (шапка, кнопки, заголовки).
const I18N = {
  en: {
    title: 'How to join — FPS Girls',
    home: 'Home',
    tagline: 'How to join',
    h1: 'Join FPS Girls',
    sub: "Pick why you are here — and get the short path: Discord, roles, and the women's FACEIT hub.",
    trackPlayerT: 'I want in the ranking',
    trackPlayerS: "I play and want to be in the FPS Girls community ranking",
    trackCoachT: "I'm looking for players",
    trackCoachS: "I'm a coach, captain or organizer building a roster",
    ctaDiscord: 'Discord',
    ctaHub: 'Faceit hub',
    ctaBoard: 'Ranking',
    faqLabel: 'Questions',
    open: 'Open'
  },
  ru: {
    title: 'Как вступить — FPS Girls',
    home: 'На главную',
    tagline: 'Как вступить',
    h1: 'Вступай в FPS Girls',
    sub: 'Выбери, зачем ты здесь, — покажем короткий путь: Discord, роли и женский хаб на FACEIT.',
    trackPlayerT: 'Хочу в рейтинг',
    trackPlayerS: 'Я играю и хочу попасть в рейтинг сообщества FPS Girls',
    trackCoachT: 'Ищу игроков',
    trackCoachS: 'Я тренер, капитан или организатор — собираю состав',
    ctaDiscord: 'Discord',
    ctaHub: 'Faceit хаб',
    ctaBoard: 'Рейтинг',
    faqLabel: 'Вопросы',
    open: 'Открыть'

let lang = 'en';
let track = 'player';

const t = () => I18N[lang] || I18N.en;
const c = () => CONTENT[lang] || CONTENT.en;

const EXT_ARROW = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>';

function renderSteps() {
  const steps = c()[track] || [];
  document.getElementById('steps').innerHTML = steps.map((s, i) => {
    const btn = s.b
      ? '<a class="step-btn' + (s.b.ghost ? ' ghost' : '') + '" href="' + s.b.href + '"' +
        (s.b.ext ? ' target="_blank" rel="noopener"' : '') + '>' + s.b.label + (s.b.ext ? EXT_ARROW : '') + '</a>'
      : '';
    return '<li class="step">' +
      '<span class="step-num">' + (i + 1) + '</span>' +
      '<div class="step-body">' +
        '<div class="step-title">' + s.t + '</div>' +
        '<div class="step-text">' + s.d + '</div>' + btn +
      '</div></li>';
  }).join('');
  document.getElementById('hint').innerHTML = c()[track === 'player' ? 'playerHint' : 'coachHint'];
  const perks = document.getElementById('perks');
  const list = track === 'player' ? (c().perks || []) : [];
  perks.hidden = !list.length;
  perks.innerHTML = list.length
    ? '<div class="perks-title">' + c().perksTitle + '</div><ul>' + list.map(p => '<li>' + p + '</li>').join('') + '</ul>'
    : '';
}

function renderFaq() {
  document.getElementById('faq').innerHTML = (c().faq || []).map(f =>
    '<details><summary>' + f.q + '</summary><div class="a">' + f.a + '</div></details>'
  ).join('');
}

function setTrack(nextTrack, updateHash = true) {
  track = CONTENT.en[nextTrack] ? nextTrack : 'player';
  document.querySelectorAll('.track').forEach(b => b.classList.toggle('active', b.dataset.track === track));
  renderSteps();
  if (updateHash) history.replaceState(null, '', '#' + track);
}

function setLang(l) {
  lang = I18N[l] ? l : 'en';
  const tr = t();
  document.documentElement.lang = lang;
  document.title = tr.title;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr[el.dataset.i18n]; });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  try { localStorage.setItem('fpsg-lang', lang); } catch (e) {}
  renderSteps();
  renderFaq();
}

document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
document.querySelectorAll('.track').forEach(b => b.addEventListener('click', () => setTrack(b.dataset.track)));

// Ветку можно открыть ссылкой: join.html#coach или ?track=coach — так на неё
// можно вести с рейтинга и из постов.
const wanted = (location.hash.replace('#', '') || new URLSearchParams(location.search).get('track') || 'player');
setTrack(wanted, false);

let saved = null;
try { saved = localStorage.getItem('fpsg-lang'); } catch (e) {}
// Язык по умолчанию: если человек ещё не выбирал, смотрим язык браузера.
// Русский для ru/be/kk/ky/uz/tg, для всех остальных английский.
function detectLang() {
  const ls = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
  return ls.some(l => /^(ru|be|kk|ky|uz|tg)\b/i.test(l)) ? 'ru' : 'en';
}
setLang(saved || detectLang());

// Счётчик посетителей (Cloudflare Worker на /api/counter). Визит — не чаще
// раза в день на браузер. Если воркер недоступен, блок просто не показываем.
(function () {
  const el = document.getElementById('visitor-counter');
  if (!el) return;
  const API = '/api/counter';
  const L = {
    ru: (total, freq) => '👥 ' + total + ' всего · ' + freq + ' часто заходят',
    en: (total, freq) => '👥 ' + total + ' total · ' + freq + ' regulars',
  };
  let counts = null;
  const fmt = (n) => Number(n).toLocaleString(document.documentElement.lang === 'ru' ? 'ru-RU' : 'en-US');
  const draw = () => {
    if (!counts) return;
    const l = document.documentElement.lang === 'ru' ? 'ru' : 'en';
    el.textContent = L[l](fmt(counts.total), fmt(counts.frequent));
    el.style.display = '';
  };
  let vid = null;
  try { vid = localStorage.getItem('fpsg_vid'); } catch (e) {}
  if (!vid) {
    vid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    try { localStorage.setItem('fpsg_vid', vid); } catch (e) {}
  }
  const today = new Date().toISOString().slice(0, 10);
  let newDay = true;
  try { newDay = localStorage.getItem('fpsg_lastday') !== today; if (newDay) localStorage.setItem('fpsg_lastday', today); } catch (e) {}
  const url = newDay ? (API + '/hit?vid=' + encodeURIComponent(vid)) : API;
  fetch(url, { cache: 'no-store' })
    .then(r => (r.ok ? r.json() : null))
    .then(d => { if (d && typeof d.total === 'number') { counts = d; draw(); } })
    .catch(() => {});
  document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setTimeout(draw, 0)));
})();
// Счётчик кликов по внешним кнопкам (Discord, FACEIT-хаб). Шлёт имя кнопки
// в воркер /api/counter/click, без личных данных. Сравниваем с числом
// использований инвайта в Discord и видим, сколько людей теряется по дороге.
// Хаб = только ссылка на клуб FACEIT: ссылки на профили игроков в рейтинге не считаем.
// Воркер недоступен — клики просто не считаются, кнопки работают как обычно.
(function () {
  const PAGE = 'join';
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href') || '';
    const target = href.includes('discord.gg') ? 'discord' : /faceit\.com\/.*\/club\//.test(href) ? 'hub' : '';
    if (!target) return;
    const url = '/api/counter/click?b=' + PAGE + '_' + target;
    try { if (!(navigator.sendBeacon && navigator.sendBeacon(url))) fetch(url, { method: 'POST', keepalive: true }).catch(() => {}); } catch (err) {}
  });
})();
