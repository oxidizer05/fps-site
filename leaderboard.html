<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рейтинг игроков — FPS Girls</title>
<meta name="description" content="Мировой рейтинг женщин на FACEIT: CS2 и Rainbow Six Siege. Сообщество FPS Girls.">

<style>
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Black.ttf') format('truetype');      font-weight: 900; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-ExtraBold.ttf') format('truetype');  font-weight: 800; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Bold.ttf') format('truetype');       font-weight: 700; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-SemiBold.ttf') format('truetype');   font-weight: 600; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Medium.ttf') format('truetype');     font-weight: 500; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Regular.ttf') format('truetype');    font-weight: 400; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Light.ttf') format('truetype');      font-weight: 300; font-display: swap; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-ExtraLight.ttf') format('truetype'); font-weight: 200; font-display: swap; }

:root {
  --accent:        #CE61DF;
  --accent-glow:   rgba(206,97,223,0.30);
  --accent-subtle: rgba(206,97,223,0.12);
  --bg:            #0D0D0D;
  --surface:       #111111;
  --surface2:      #161318;
  --border:        rgba(255,255,255,0.08);
  --border-accent: rgba(206,97,223,0.40);
  --white:         #FFFFFF;
  --gray1:         #969696;
  --gold:          #F5C451;
  --silver:        #C7CAD1;
  --bronze:        #D08A54;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #080808;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  font-family: 'Montserrat', sans-serif;
  padding: 32px 16px 56px;
  color: var(--white);
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.35;
}

.page {
  width: 100%;
  max-width: 960px;
  position: relative;
  z-index: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 12px 60px rgba(0,0,0,0.8);
}

/* ── Header ── */
.header {
  padding: 26px 24px 22px;
  text-align: center;
  position: relative;
  overflow: hidden;
  background: linear-gradient(160deg, #180d20 0%, #0d0d14 60%, #0d0d0d 100%);
  border-bottom: 1px solid var(--border);
}
.header::after {
  content: '';
  position: absolute;
  top: -80px; left: 50%;
  transform: translateX(-50%);
  width: 320px; height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(206,97,223,0.16) 0%, transparent 70%);
  pointer-events: none;
}
.avatar {
  width: 66px; height: 66px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--accent);
  box-shadow: 0 0 20px var(--accent-glow);
  position: relative; z-index: 1;
}
.wordmark {
  font-weight: 900; font-size: 22px;
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-top: 12px; line-height: 1;
  position: relative; z-index: 1;
}
.tagline {
  font-weight: 200; font-size: 10px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--accent); margin-top: 6px;
  position: relative; z-index: 1;
}
.home-link {
  position: absolute; top: 16px; left: 16px; z-index: 2;
  display: inline-flex; align-items: center; gap: 5px;
  font-weight: 700; font-size: 10px; letter-spacing: 0.08em;
  color: var(--gray1); text-decoration: none;
  border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 10px; transition: color 150ms, border-color 150ms;
}
.home-link:hover { color: var(--white); border-color: var(--border-accent); }

.lang-switch {
  position: absolute; top: 16px; right: 16px;
  display: flex; gap: 2px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 6px; padding: 2px; z-index: 2;
}
.lang-btn {
  font-family: inherit; font-weight: 700; font-size: 10px;
  letter-spacing: 0.08em; color: var(--gray1);
  background: transparent; border: none; border-radius: 4px;
  padding: 5px 9px; cursor: pointer; transition: color 150ms, background 150ms;
}
.lang-btn:hover { color: var(--white); }
.lang-btn.active { background: var(--accent); color: #fff; }

/* ── Controls ── */
.controls {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 12px; padding: 20px 24px 6px;
}
.tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
.tab {
  font-family: inherit; font-weight: 700; font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--gray1); background: transparent; border: none;
  border-radius: 6px; padding: 8px 16px; cursor: pointer;
  transition: color 150ms, background 150ms;
}
.tab:hover { color: var(--white); }
.tab.active { background: var(--accent); color: #fff; }

.search {
  flex: 1; min-width: 160px; max-width: 260px;
  font-family: inherit; font-size: 12px; color: var(--white);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; outline: none;
  transition: border-color 150ms;
}
.search::placeholder { color: var(--gray1); }
.search:focus { border-color: var(--border-accent); }

/* ── Сортировка ── */
.sort {
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 8px; padding: 3px 8px 3px 3px;
}
.sort-label {
  font-weight: 700; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--gray1); padding: 0 6px 0 8px;
}
.sort-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: inherit; font-weight: 700; font-size: 10px;
  letter-spacing: 0.06em; color: var(--gray1);
  background: transparent; border: none; border-radius: 6px;
  padding: 7px 10px; cursor: pointer;
  transition: color 150ms, background 150ms;
}
.sort-btn:hover { color: var(--white); }
.sort-btn.active { background: var(--accent); color: #fff; }
.sort-btn .arrow { font-style: normal; font-size: 8px; opacity: 0.9; }

.board thead th.sortable { cursor: pointer; user-select: none; }
.board thead th.sortable:hover { color: var(--white); }
.board thead th.sorted { color: var(--white); }
.board thead th .arrow { font-style: normal; font-size: 8px; margin-left: 3px; }

/* ── Podium ── */
.podium {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; padding: 14px 24px 4px;
}
.pod {
  position: relative; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 12px 14px; text-align: center; overflow: hidden;
}
.pod::before {
  content: ''; position: absolute; inset: 0 0 auto 0; height: 3px;
}
.pod.g1::before { background: var(--gold); }
.pod.g2::before { background: var(--silver); }
.pod.g3::before { background: var(--bronze); }
.pod.g1 { border-color: rgba(245,196,81,0.4); box-shadow: 0 0 24px rgba(245,196,81,0.10); }
.pod-medal { font-size: 22px; line-height: 1; }
.pod-flag { font-size: 18px; margin-top: 6px; }
.pod-name {
  font-weight: 800; font-size: 14px; margin-top: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pod-elo { font-weight: 900; font-size: 20px; color: var(--accent); margin-top: 6px; }
.pod-sub { font-weight: 500; font-size: 10px; color: var(--gray1); margin-top: 3px; letter-spacing: 0.04em; }

/* ── Самые стабильные ── */
.stable-label {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 24px 0;
}
.stable-label .line { flex: 1; height: 1px; background: rgba(206,97,223,0.2); }
.stable-label span {
  font-weight: 700; font-size: 9px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--accent);
}
.stable-hint {
  padding: 6px 24px 0; text-align: center;
  font-weight: 400; font-size: 10px; line-height: 1.4; color: rgba(150,150,150,0.75);
}
.stable {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 8px; padding: 10px 24px 0;
}
.s-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 8px; text-align: center;
  display: flex; flex-direction: column; gap: 3px; min-width: 0;
}
.s-card.first { border-color: var(--border-accent); box-shadow: 0 0 16px rgba(206,97,223,0.12); }
.s-rank { font-weight: 800; font-size: 10px; color: var(--accent); letter-spacing: 0.1em; }
.s-nick {
  font-weight: 700; font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.s-nick a { color: var(--white); text-decoration: none; }
.s-nick a:hover { color: var(--accent); }
.s-meta { font-weight: 500; font-size: 9px; color: var(--gray1); line-height: 1.5; }
.s-meta b { color: #D9D9D9; font-weight: 700; }

/* ── Лучший показатель в столбце ── */
.best {
  color: var(--accent) !important;
  font-weight: 800;
  background: var(--accent-subtle);
  border-radius: 4px;
}

/* ── Table ── */
.board-wrap { padding: 14px 24px 4px; overflow-x: auto; }
table.board { width: 100%; border-collapse: collapse; font-size: 13px; }
.board thead th {
  font-weight: 700; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent); text-align: right; padding: 8px 10px;
  border-bottom: 1px solid rgba(206,97,223,0.2); white-space: nowrap;
}
.board thead th.left { text-align: left; }
.board tbody td {
  padding: 9px 10px; text-align: right; white-space: nowrap;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.board tbody td.left { text-align: left; }
.board tbody tr:hover { background: rgba(255,255,255,0.02); }
.rank { font-weight: 800; color: var(--gray1); width: 34px; }
.player { display: flex; align-items: center; gap: 8px; }
.player .flag { font-size: 15px; }
.player .nick { font-weight: 700; }
.player a { color: var(--white); text-decoration: none; }
.player a:hover { color: var(--accent); }
.elo { font-weight: 800; color: var(--accent); }
.lvl {
  display: inline-block; min-width: 22px; text-align: center;
  font-weight: 800; font-size: 11px; color: #0d0d0d;
  border-radius: 5px; padding: 2px 5px;
}
.dim { color: var(--gray1); }
tr.hidden { display: none; }

/* ── States ── */
.state { padding: 48px 24px; text-align: center; color: var(--gray1); font-size: 13px; font-weight: 500; }
.state .spinner {
  width: 28px; height: 28px; margin: 0 auto 14px;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Footer ── */
.foot {
  border-top: 1px solid var(--border); margin-top: 18px;
  padding: 14px 24px; display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: 8px;
}
.foot .updated { font-weight: 500; font-size: 10px; letter-spacing: 0.06em; color: var(--gray1); }
.foot .brand { font-weight: 200; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(206,97,223,0.4); }

.note {
  padding: 0 24px; margin-top: 4px;
  font-weight: 400; font-size: 10px; line-height: 1.5; color: rgba(150,150,150,0.7); text-align: center;
}

@media (max-width: 560px) {
  .board .col-matches, .board .col-wr { display: none; }
  /* столбец, по которому сортируем, показываем даже на узком экране */
  .board.show-wr .col-wr, .board.show-matches .col-matches { display: table-cell; }
  .pod-name { font-size: 12px; }
  .pod-elo { font-size: 17px; }
  .stable { grid-template-columns: repeat(2, 1fr); }
  .stable .s-card:nth-child(5) { grid-column: 1 / -1; }
}
</style>
</head>

<body>
<div class="page">

  <header class="header">
    <a class="home-link" href="index.html">← <span data-i18n="home">На главную</span></a>
    <div class="lang-switch">
      <button class="lang-btn" type="button" data-lang="en">EN</button>
      <button class="lang-btn active" type="button" data-lang="ru">RU</button>
    </div>
    <img class="avatar" src="assets/logo.jpg" alt="FPS Girls">
    <div class="wordmark">FPS Girls</div>
    <div class="tagline" data-i18n="tagline">Рейтинг игроков</div>
  </header>

  <div class="controls">
    <div class="tabs">
      <button class="tab active" type="button" data-game="cs2">CS2</button>
      <button class="tab" type="button" data-game="rainbow_6">R6 Siege</button>
    </div>
    <div class="sort" id="sort">
      <span class="sort-label" data-i18n="sortLabel">Сортировка</span>
      <button class="sort-btn active" type="button" data-sort="elo"><span data-i18n="colElo">ELO</span><i class="arrow"></i></button>
      <button class="sort-btn" type="button" data-sort="winRate"><span data-i18n="colWr">Винрейт</span><i class="arrow"></i></button>
      <button class="sort-btn" type="button" data-sort="kd"><span data-i18n="colKd">K/D</span><i class="arrow"></i></button>
      <button class="sort-btn" type="button" data-sort="matches"><span data-i18n="colMatches">Матчи</span><i class="arrow"></i></button>
    </div>
    <input class="search" type="text" data-i18n-ph="search" placeholder="Поиск по нику…" id="search">
  </div>

  <div id="content">
    <div class="state"><div class="spinner"></div><span data-i18n="loading">Загружаем рейтинг…</span></div>
  </div>

  <p class="note" data-i18n="note">В рейтинге — участницы FACEIT-клуба FPS Girls, подтверждённые администрацией клуба. Обновляется автоматически.</p>

  <footer class="foot">
    <div class="updated" id="updated"></div>
    <div class="brand">Female Play Style</div>
  </footer>

</div>

<script>
// Данные лежат рядом на сайте (world.json), их раз в сутки обновляет
// GitHub Action (.github/workflows/update-world.yml). Никакого внешнего API.
// Тестовое переопределение источника: ?data=путь_или_URL
const DATA_URL = new URLSearchParams(location.search).get('data') || 'world.json';

const I18N = {
  ru: {
    title: 'Рейтинг игроков — FPS Girls', home: 'На главную', tagline: 'Рейтинг игроков',
    search: 'Поиск по нику…', loading: 'Загружаем рейтинг…',
    note: 'В рейтинге — участницы FACEIT-клуба FPS Girls, подтверждённые администрацией клуба. Обновляется автоматически.',
    error: 'Не удалось загрузить рейтинг. Попробуйте обновить страницу позже.',
    empty: 'Пока нет данных для этой игры.',
    colPlayer: 'Игрок', colElo: 'ELO', colLvl: 'Ур.', colWr: 'Винрейт', colKd: 'K/D', colMatches: 'Матчи',
    players: 'игроков', updated: 'Обновлено', never: 'ещё не обновлялось',
    sortLabel: 'Сортировка',
    stableTitle: 'Самые стабильные',
    stableHint: 'Винрейт и K/D выше среднего на большой дистанции — от 500 матчей. Розовым в таблице отмечен лучший показатель в каждом столбце.',
    matchesShort: 'матчей'
  },
  en: {
    title: 'Player ranking — FPS Girls', home: 'Home', tagline: 'Player ranking',
    search: 'Search by nickname…', loading: 'Loading ranking…',
    note: 'The ranking lists FPS Girls FACEIT club members verified by the club admins. Updates automatically.',
    error: 'Could not load the ranking. Please try again later.',
    empty: 'No data for this game yet.',
    colPlayer: 'Player', colElo: 'ELO', colLvl: 'Lvl', colWr: 'Win rate', colKd: 'K/D', colMatches: 'Matches',
    players: 'players', updated: 'Updated', never: 'not updated yet',
    sortLabel: 'Sort by',
    stableTitle: 'Most consistent',
    stableHint: 'Win rate and K/D above average over a long run — 500+ matches. Pink marks the best value in each column of the table.',
    matchesShort: 'matches'
  }
};

const LEVEL_COLOR = {
  1:'#e8e8e8', 2:'#7ed957', 3:'#7ed957', 4:'#f5d547', 5:'#f5d547',
  6:'#f5d547', 7:'#f5d547', 8:'#ff8c00', 9:'#ff8c00', 10:'#e6394a'
};

let lang = 'ru';
let game = 'cs2';
let sortKey = 'elo';   // elo | winRate | kd | matches
let sortDir = 'desc';  // desc | asc
let data = null; // { updatedAt, total, games: { cs2:[], rainbow_6:[] } }

// Сортировка по выбранному показателю. Пустые значения всегда в конце,
// независимо от направления, — иначе при возрастании сверху окажутся прочерки.
function sortRows(rows) {
  const dir = sortDir === 'asc' ? 1 : -1;
  return [...rows].sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (av == null && bv == null) return a.rank - b.rank;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (av === bv) return a.rank - b.rank; // при равенстве — по месту в мире
    return (av - bv) * dir;
  });
}

const SORT_KEYS = ['elo', 'winRate', 'kd', 'matches'];
const ARROW = () => (sortDir === 'desc' ? '▼' : '▲');

// Показываем только те кнопки сортировки, по которым в этой игре есть данные
// (в R6 нет карьерной статы, там сортировать можно лишь по ELO).
function syncSort() {
  const rows = data?.games?.[game] || [];
  const usable = SORT_KEYS.filter(k => rows.some(r => r[k] != null));
  if (!usable.includes(sortKey)) { sortKey = usable[0] || 'elo'; sortDir = 'desc'; }
  document.querySelectorAll('.sort-btn').forEach(b => {
    const on = b.dataset.sort === sortKey;
    b.style.display = usable.includes(b.dataset.sort) ? '' : 'none';
    b.classList.toggle('active', on);
    b.querySelector('.arrow').textContent = on ? ARROW() : '';
  });
  document.getElementById('sort').style.display = usable.length > 1 ? '' : 'none';
}

function setSort(key) {
  if (sortKey === key) {
    sortDir = sortDir === 'desc' ? 'asc' : 'desc'; // повторный клик — обратный порядок
  } else {
    sortKey = key;
    sortDir = 'desc';
  }
  syncSort();
  render();
}

function t() { return I18N[lang]; }

function flag(cc) {
  if (!cc || cc.length !== 2 || !/^[a-zA-Z]{2}$/.test(cc)) return '🏳️';
  return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
}
function faceitUrl(nick) { return 'https://www.faceit.com/en/players/' + encodeURIComponent(nick); }
function num(n) { return n == null ? '—' : Number(n).toLocaleString(lang === 'ru' ? 'ru-RU' : 'en-US'); }

// «Стабильность» — не разовая удача, а результат на дистанции: винрейт и K/D
// относительно среднего, с порогом по числу матчей и небольшой добавкой за
// наигранность. Без порога наверх лезут игроки с 60% побед на 30 матчах.
const STABLE_MIN_MATCHES = 500;
const STABLE_MIN_POOL = 8; // меньше — статистика бессмысленна, блок не показываем

function stableTop(rows, count = 5) {
  const pool = rows.filter(r => r.matches >= STABLE_MIN_MATCHES && r.winRate != null && r.kd != null);
  if (pool.length < STABLE_MIN_POOL) return [];
  const stat = (vals) => {
    const m = vals.reduce((s, x) => s + x, 0) / vals.length;
    const sd = Math.sqrt(vals.reduce((s, x) => s + (x - m) ** 2, 0) / vals.length) || 1;
    return { m, sd };
  };
  const W = stat(pool.map(r => r.winRate));
  const K = stat(pool.map(r => r.kd));
  const V = stat(pool.map(r => Math.log10(r.matches)));
  return pool
    .map(r => ({
      ...r,
      score: 0.45 * ((r.winRate - W.m) / W.sd)
           + 0.45 * ((r.kd - K.m) / K.sd)
           + 0.10 * ((Math.log10(r.matches) - V.m) / V.sd)
    }))
    .sort((a, b) => b.score - a.score)
    .slice(0, count);
}

function stableBlock(rows) {
  const top = stableTop(rows);
  if (!top.length) return '';
  const cards = top.map((r, i) =>
    '<div class="s-card' + (i === 0 ? ' first' : '') + '">' +
      '<div class="s-rank">#' + (i + 1) + '</div>' +
      '<div class="s-nick">' + flag(r.country) + ' <a href="' + faceitUrl(r.nickname) + '" target="_blank" rel="noopener">' + esc(r.nickname) + '</a></div>' +
      '<div class="s-meta"><b>' + r.winRate + '%</b> · K/D <b>' + r.kd + '</b><br>' + num(r.matches) + ' ' + t().matchesShort + '</div>' +
    '</div>'
  ).join('');
  return '<div class="stable-label"><div class="line"></div><span>🎯 ' + t().stableTitle + '</span><div class="line"></div></div>' +
         '<div class="stable">' + cards + '</div>' +
         '<div class="stable-hint">' + t().stableHint + '</div>';
}

// Лучшее значение в каждом столбце — подсвечиваем розовым. Уровень не берём:
// «десятка» у десятков игроков, подсветка была бы шумом.
function columnBests(rows) {
  const max = (key) => {
    const vals = rows.map(r => r[key]).filter(v => v != null);
    return vals.length ? Math.max(...vals) : null;
  };
  return { elo: max('elo'), winRate: max('winRate'), kd: max('kd'), matches: max('matches') };
}

// Значение активного показателя — крупной цифрой на подиуме
function metricValue(r, key) {
  if (key === 'winRate') return r.winRate != null ? r.winRate + '%' : '—';
  if (key === 'kd') return r.kd != null ? r.kd : '—';
  return num(r[key]);
}

function render() {
  const content = document.getElementById('content');
  if (!data) return;
  const raw = data.games[game] || [];
  if (!raw.length) { content.innerHTML = '<div class="state">' + t().empty + '</div>'; return; }
  const rows = sortRows(raw);
  const best = columnBests(raw);
  const mark = (val, key) => (val != null && val === best[key] ? ' best' : '');

  // Подиум следует выбранной сортировке: сортируешь по K/D — на подиуме
  // лидеры по K/D, а не по ELO.
  const top3 = rows.slice(0, 3);
  const medals = ['🥇', '🥈', '🥉'];
  const podium = '<div class="podium">' + top3.map((r, i) =>
    '<div class="pod g' + (i + 1) + '">' +
      '<div class="pod-medal">' + medals[i] + '</div>' +
      '<div class="pod-flag">' + flag(r.country) + '</div>' +
      '<div class="pod-name">' + esc(r.nickname) + '</div>' +
      '<div class="pod-elo">' + metricValue(r, sortKey) + '</div>' +
      '<div class="pod-sub">' + (sortKey === 'elo'
        ? t().colLvl + ' ' + (r.level ?? '—') + (r.kd != null ? ' · K/D ' + r.kd : '')
        : t().colElo + ' ' + num(r.elo) + ' · ' + t().colLvl + ' ' + (r.level ?? '—')) + '</div>' +
    '</div>'
  ).join('') + '</div>';

  const th = (label, key, cls = '') => {
    const sortable = SORT_KEYS.includes(key) && raw.some(r => r[key] != null);
    const on = sortable && sortKey === key;
    return '<th class="' + cls + (sortable ? ' sortable' : '') + (on ? ' sorted' : '') + '"' +
      (sortable ? ' data-sort="' + key + '"' : '') + '>' + label +
      (on ? '<i class="arrow">' + ARROW() + '</i>' : '') + '</th>';
  };

  const head =
    '<thead><tr>' +
      '<th>#</th>' +
      '<th class="left">' + t().colPlayer + '</th>' +
      th(t().colElo, 'elo') +
      '<th>' + t().colLvl + '</th>' +
      th(t().colWr, 'winRate', 'col-wr') +
      th(t().colKd, 'kd') +
      th(t().colMatches, 'matches', 'col-matches') +
    '</tr></thead>';

  const body = '<tbody>' + rows.map((r, i) => {
    const color = LEVEL_COLOR[r.level] || '#99aab5';
    return '<tr data-nick="' + esc((r.nickname || '').toLowerCase()) + '">' +
      '<td class="rank">' + (i + 1) + '</td>' +
      '<td class="left"><div class="player"><span class="flag">' + flag(r.country) + '</span>' +
        '<span class="nick"><a href="' + faceitUrl(r.nickname) + '" target="_blank" rel="noopener">' + esc(r.nickname) + '</a></span></div></td>' +
      '<td class="elo' + mark(r.elo, 'elo') + '">' + num(r.elo) + '</td>' +
      '<td><span class="lvl" style="background:' + color + '">' + (r.level ?? '—') + '</span></td>' +
      '<td class="col-wr dim' + mark(r.winRate, 'winRate') + '">' + (r.winRate != null ? r.winRate + '%' : '—') + '</td>' +
      '<td class="dim' + mark(r.kd, 'kd') + '">' + (r.kd != null ? r.kd : '—') + '</td>' +
      '<td class="col-matches dim' + mark(r.matches, 'matches') + '">' + num(r.matches) + '</td>' +
    '</tr>';
  }).join('') + '</tbody>';

  content.innerHTML = stableBlock(raw) + podium +
    '<div class="board-wrap"><table class="board' +
      (sortKey === 'winRate' ? ' show-wr' : '') + (sortKey === 'matches' ? ' show-matches' : '') +
    '">' + head + body + '</table></div>';
  // заголовки пересоздаются при каждой отрисовке — навешиваем обработчик заново
  content.querySelectorAll('th.sortable').forEach(h =>
    h.addEventListener('click', () => setSort(h.dataset.sort)));
  applySearch();
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

function applySearch() {
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  document.querySelectorAll('tbody tr').forEach(tr => {
    tr.classList.toggle('hidden', q && !tr.dataset.nick.includes(q));
  });
}

function renderUpdated() {
  const el = document.getElementById('updated');
  if (!data || !data.updatedAt) { el.textContent = t().updated + ': ' + t().never; return; }
  const d = new Date(data.updatedAt);
  const stamp = d.toLocaleString(lang === 'ru' ? 'ru-RU' : 'en-US', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  el.textContent = t().updated + ': ' + stamp + ' · ' + (data.total || 0) + ' ' + t().players;
}

function setLang(l) {
  lang = I18N[l] ? l : 'ru';
  const tr = t();
  document.documentElement.lang = lang;
  document.title = tr.title;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = tr[el.dataset.i18nPh]; });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  try { localStorage.setItem('fpsg-lang', lang); } catch (e) {}
  if (data) { syncSort(); render(); renderUpdated(); }
}

function setGame(g) {
  game = g;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.game === g));
  syncSort(); // в разных играх доступны разные показатели
  render();
}

// Вкладку игры показываем только когда по ней есть осмысленный рейтинг:
// в R6 подтверждённых девушек пока единицы, пустая таблица выглядела бы поломкой.
const MIN_ROWS_FOR_TAB = 5;

function syncTabs() {
  let visible = [];
  document.querySelectorAll('.tab').forEach(b => {
    const enough = (data?.games?.[b.dataset.game] || []).length >= MIN_ROWS_FOR_TAB;
    b.style.display = enough ? '' : 'none';
    if (enough) visible.push(b.dataset.game);
  });
  document.querySelector('.tabs').style.display = visible.length > 1 ? '' : 'none';
  if (visible.length && !visible.includes(game)) setGame(visible[0]);
}

async function load() {
  try {
    const url = DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
    syncTabs();
    syncSort();
    render();
    renderUpdated();
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="state">' + t().error + '</div>';
  }
}

document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setGame(b.dataset.game)));
document.querySelectorAll('.sort-btn').forEach(b => b.addEventListener('click', () => setSort(b.dataset.sort)));
document.getElementById('search').addEventListener('input', applySearch);

let saved = null;
try { saved = localStorage.getItem('fpsg-lang'); } catch (e) {}
setLang(saved || 'ru');
load();
</script>
</body>
</html>
